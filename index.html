<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>壽險商品查詢</title>
<meta name="theme-color" content="#1d3557">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="壽險查詢">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>壽險商品查詢</h1>
  <p id="meta">載入中…</p>
</header>

<main id="view"></main>

<div id="compareBar" class="compare-bar" hidden>
  <span id="compareCount"></span>
  <button id="compareClear" class="ghost">清除</button>
  <button id="compareGo" class="primary">開始比較</button>
</div>

<nav class="tabs" id="tabs">
  <a href="#search" data-tab="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg>查詢</a>
  <a href="#new" data-tab="new"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 7.2H22l-6 4.6 2.3 7.2-6.3-4.5-6.3 4.5L8 13.8 2 9.2h7.6z"/></svg>新商品</a>
  <a href="#compare" data-tab="compare"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>比較<b id="cmpBadge" hidden></b></a>
  <a href="#fav" data-tab="fav"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.3C1 8 3.4 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.6 0 6 3.5 4.5 7.2C19.5 16.4 12 21 12 21z"/></svg>最愛</a>
  <a href="#companies" data-tab="companies"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>公司</a>
</nav>

<dialog id="sheet" class="sheet"><div id="sheetBody"></div></dialog>

<script src="app.js"></script>
</body>
</html>
